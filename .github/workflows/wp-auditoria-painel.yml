name: CAMP Painel - auditoria coleta de pedidos (sem deploy)
on:
  push:
    branches:
      - claude/wp-aud-01-pedidos-ack
      - claude/wp-aud-05-auditoria-publicacao
      - claude/wp-aud-01-recuperacao-historica
  pull_request:
    paths:
      - 'backend/app/coletor_pedidos_site.py'
      - 'tests/teste_coleta_pedidos_ack.py'
      - '.github/workflows/wp-auditoria-painel.yml'
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias do backend
        run: python -m pip install -r backend/requirements.txt
      - name: Sintaxe Python
        run: python -m py_compile backend/app/coletor_pedidos_site.py tests/teste_coleta_pedidos_ack.py
      - name: Falhas de commit, ACK e 225 pedidos
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -p 'teste_coleta_pedidos_ack.py' -v
      - name: Auditoria da publicacao somente leitura
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -p 'teste_auditoria_publicacao.py' -v
      - name: Recuperar pedidos da versao antiga em modo simular
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -p 'teste_recuperar_pedidos_site.py' -v
